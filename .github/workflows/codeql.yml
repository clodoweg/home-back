# CodeQL static analysis (security queries) of the TypeScript code and of the workflows themselves.
# Free on a public repository; findings appear under Security → Code scanning and as PR annotations.
# Advanced setup (this file) rather than the « default setup » of the repository settings: both
# cannot be enabled together.
name: CodeQL

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    # Weekly, Wednesday 04:23 UTC: new queries reach unchanged code too.
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      # No build: CodeQL extracts JavaScript / TypeScript and workflow files from the sources.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
