name: Backend checks

# Every PR to main, and main itself after the merge: a squash merge on a stale base can produce a
# tree no PR run has checked. The repository is public, so GitHub-hosted runners cost no minutes.
# Every PR runs it, documentation included: the ruleset on main requires this check, and a check
# that never starts would block the PR. Only the push to main skips documentation-only changes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR (or to main) cancels the run it replaces.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Coverage thresholds in vitest.config.mts make this step fail below the audit targets.
      # Tests mock every external service and set their own environment (__tests__/setup.ts).
      - name: Tests with coverage
        run: npm run test:coverage
